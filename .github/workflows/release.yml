name: Release

on:
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # master = stable releases (vX.Y.Z)
  release-please-stable:
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

  # develop = beta prereleases (vX.Y.Z-beta.N), promoted to a stable release
  # once develop is merged into master.
  release-please-beta:
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config-beta.json
          manifest-file: .release-please-manifest-beta.json
          target-branch: develop

  build-installers:
    needs: [release-please-stable, release-please-beta]
    # always() because a job skipped by its own `if` (the stable/beta job that
    # didn't match this push's branch) would otherwise skip this job too.
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.release-please-stable.outputs.release_created == 'true' ||
       needs.release-please-beta.outputs.release_created == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            jpackage_type: exe
          - os: ubuntu-latest
            jpackage_type: deb
          - os: macos-latest
            jpackage_type: pkg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ needs.release-please-stable.outputs.tag_name ||
                needs.release-please-beta.outputs.tag_name ||
                github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build shaded jar
        shell: bash
        run: mvn -B -DskipTests package

      - name: Stage jpackage input
        shell: bash
        run: |
          mkdir -p target/jpackage-input
          cp target/Emberveil-*-app.jar target/jpackage-input/

      - name: Determine version
        shell: bash
        env:
          TAG_NAME: >-
            ${{ needs.release-please-stable.outputs.tag_name ||
                needs.release-please-beta.outputs.tag_name }}
        run: |
          if [ -n "$TAG_NAME" ]; then
            full_version="${TAG_NAME#v}"
          else
            full_version=$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.*)<\/version>.*/\1/')
          fi
          echo "FULL_VERSION=$full_version" >> "$GITHUB_ENV"
          # jpackage's Windows/macOS installers require a clean numeric
          # version (no -beta.N suffix); the full version (with suffix) is
          # used for the uploaded filename instead, further down.
          echo "APP_VERSION=${full_version%%-*}" >> "$GITHUB_ENV"

      - name: Build installer
        shell: bash
        run: |
          jar=$(ls target/jpackage-input/*.jar | head -n1)
          jar_name=$(basename "$jar")

          extra_args=()
          case "${{ matrix.os }}" in
            windows-latest)
              extra_args+=(--win-menu --win-shortcut --win-dir-chooser)
              ;;
            ubuntu-latest)
              extra_args+=(--linux-shortcut --linux-package-name emberveil)
              ;;
            macos-latest)
              extra_args+=(--mac-package-identifier com.swiftfaze.emberveil)
              ;;
          esac

          jpackage --type "${{ matrix.jpackage_type }}" \
            --input target/jpackage-input \
            --dest target/dist \
            --name Emberveil \
            --app-version "$APP_VERSION" \
            --vendor SwiftFaze \
            --main-jar "$jar_name" \
            --main-class com.swiftfaze.emberveil.Main \
            "${extra_args[@]}"

      - name: Normalize installer filename
        shell: bash
        run: |
          src=$(ls target/dist/*.${{ matrix.jpackage_type }} | head -n1)
          mv "$src" "target/dist/Emberveil-${FULL_VERSION}.${{ matrix.jpackage_type }}"

      - name: Upload installer as a workflow artifact (manual test runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: target/dist/Emberveil-${{ env.FULL_VERSION }}.${{ matrix.jpackage_type }}

      - name: Upload installer to the GitHub Release
        if: >-
          needs.release-please-stable.outputs.release_created == 'true' ||
          needs.release-please-beta.outputs.release_created == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: >-
            ${{ needs.release-please-stable.outputs.tag_name ||
                needs.release-please-beta.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" "target/dist/Emberveil-${FULL_VERSION}.${{ matrix.jpackage_type }}" --clobber --repo ${{ github.repository }}
