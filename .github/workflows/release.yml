name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-installers:
    needs: release-please
    # Runs for a real release, or on-demand via workflow_dispatch to test the
    # jpackage steps below (e.g. for a new platform) without cutting a release.
    if: github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            jpackage_type: exe
          - os: ubuntu-latest
            jpackage_type: deb
          - os: macos-latest
            jpackage_type: pkg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build shaded jar
        shell: bash
        run: mvn -B -DskipTests package

      - name: Stage jpackage input
        shell: bash
        run: |
          mkdir -p target/jpackage-input
          cp target/Emberveil-*-app.jar target/jpackage-input/

      - name: Determine app version
        shell: bash
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -n "$TAG_NAME" ]; then
            echo "APP_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
          else
            version=$(grep -m1 '<version>' pom.xml | sed -E 's/.*<version>(.*)<\/version>.*/\1/')
            echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          fi

      - name: Build installer
        shell: bash
        run: |
          jar=$(ls target/jpackage-input/*.jar | head -n1)
          jar_name=$(basename "$jar")

          extra_args=()
          case "${{ matrix.os }}" in
            windows-latest)
              extra_args+=(--win-menu --win-shortcut --win-dir-chooser)
              ;;
            ubuntu-latest)
              extra_args+=(--linux-shortcut --linux-package-name emberveil)
              ;;
            macos-latest)
              extra_args+=(--mac-package-identifier com.swiftfaze.emberveil)
              ;;
          esac

          jpackage --type "${{ matrix.jpackage_type }}" \
            --input target/jpackage-input \
            --dest target/dist \
            --name Emberveil \
            --app-version "$APP_VERSION" \
            --vendor SwiftFaze \
            --main-jar "$jar_name" \
            --main-class com.swiftfaze.emberveil.Main \
            "${extra_args[@]}"

      - name: Upload installer as a workflow artifact (manual test runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: target/dist/*.${{ matrix.jpackage_type }}

      - name: Upload installer to the GitHub Release
        if: needs.release-please.outputs.release_created == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          installer=$(ls target/dist/*.${{ matrix.jpackage_type }} | head -n1)
          gh release upload "$TAG_NAME" "$installer" --clobber --repo ${{ github.repository }}
