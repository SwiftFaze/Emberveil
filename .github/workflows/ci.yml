name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          branch="${{ github.head_ref }}"
          if [[ ! "$branch" =~ ^(fix|feature|hotfix|chore|docs)/[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::Branch name '$branch' isn't allowed. Use one of: fix/, feature/, hotfix/, chore/, docs/ (docs/ only for doc-only changes), followed by a slug."
            exit 1
          fi
          echo "Branch name '$branch' OK"

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test (unit + acceptance + integration)
        run: mvn -B verify
